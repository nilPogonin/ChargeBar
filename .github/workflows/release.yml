name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Test protocol logic
        run: go test -race -cover ./internal/battery
      - name: Check Windows source
        run: go vet ./...
      - name: Build Windows x64
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o dist/ChargeBar.exe ./cmd/chargebar
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item docs/README-RU.txt dist/README.txt
          Copy-Item docs/*.cmd dist/
          Copy-Item LICENSE,GO-LICENSE.txt,THIRD-PARTY-NOTICES.txt dist/
          $hash = (Get-FileHash dist/ChargeBar.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ChargeBar.exe" | Set-Content dist/SHA256.txt -Encoding ascii
          Compress-Archive -Path dist/* -DestinationPath ChargeBar-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeBar-Windows-x64
          path: |
            dist/ChargeBar.exe
            dist/SHA256.txt
            ChargeBar-Windows-x64.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v1.0.0' }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; existing assets are preserved.'
            exit 0
          }
          gh release create $tag dist/ChargeBar.exe dist/SHA256.txt ChargeBar-Windows-x64.zip --target $env:GITHUB_SHA --title "ChargeBar $tag" --notes-file RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
